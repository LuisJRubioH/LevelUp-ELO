# .github/workflows/ci.yml
# CI/CD para LevelUp-ELO — 9 jobs
# Disparadores: push a main, pull_request hacia main
# Also pull requests into `redesign`, the staging branch stacked work targets until the redesign
# lands on main.

name: LevelUp-ELO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, redesign]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Validar banco de preguntas ────────────────────────────────
  validate-bank:
    name: "Banco de preguntas"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ejecutar validador del banco
        run: python scripts/validate_bank.py

  # ── Job 2: Linting y formateo ─────────────────────────────────────────
  lint:
    name: "Lint & formato"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar herramientas de lint
        run: pip install black==24.3.0 flake8==7.0.0

      - name: Black (solo verificar, no modificar)
        run: black --check --line-length=100 src/ tests/ scripts/

      - name: Flake8 (errores críticos solamente)
        run: |
          flake8 src/ tests/ scripts/ \
            --max-line-length=100 \
            --select=E9,F63,F7,F82 \
            --count

  # ── Job 3: Tests unitarios ────────────────────────────────────────────
  test-unit:
    name: "Tests unitarios"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        # Unit tests cover V1 (requirements.txt) and API modules (requirements-api.txt;
        # it also pins pytest and pytest-cov).
        run: pip install -r requirements.txt -r requirements-api.txt

      - name: Ejecutar tests unitarios con cobertura
        run: |
          python -m pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=src/domain \
            --cov=src/application \
            --cov-report=term-missing \
            --cov-fail-under=70
        env:
          TESTING: "1"

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage

  # ── Job 4: Tests de integración ───────────────────────────────────────
  test-integration:
    name: "Tests de integración"
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-api.txt

      - name: Ejecutar tests de integración (SQLite en archivo temporal)
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short
        env:
          TESTING: "1"

  # ── Job 5: Paridad SQLite/PostgreSQL ─────────────────────────────────
  db-sync:
    name: "Paridad DB"
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar paridad SQLite/PostgreSQL
        run: python scripts/db_sync_check.py

  test-postgres:
    name: "Guardas PostgreSQL"
    runs-on: ubuntu-latest
    needs: [db-sync]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levelup_audit
          POSTGRES_PASSWORD: audit_local_only
          POSTGRES_DB: levelup_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelup_audit -d levelup_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        # requirements.txt too: tests/integration/test_v1_run_migrations.py runs V1's entry
        # point (Streamlit) against PostgreSQL and would otherwise skip here.
        run: pip install -r requirements.txt -r requirements-api.txt

      - name: Ejecutar guardas sobre PostgreSQL real
        # test_elo_single_source corre en los dos motores: aquí toma la rama
        # PostgreSQL. La paridad estática de db_sync_check no demuestra
        # equivalencia de resultados ni comportamiento bajo concurrencia.
        # The whole folder, not a file list: every two-engine test (the `repo` fixture in
        # tests/integration/conftest.py) must take its PostgreSQL branch here, including the
        # spec 001 tests added later. `-rs` lists any skip so a skipped PG branch is visible.
        run: |
          python -m pytest tests/integration/ -v --tb=short -rs
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://levelup_audit:audit_local_only@localhost:5432/levelup_audit
          DATABASE_SSLMODE: disable
          ADMIN_PASSWORD: postgres-audit-admin
          TESTING: "1"

  # ── Job 6: Tests de integración API (FastAPI) ─────────────────────────
  test-api:
    name: "Tests API FastAPI"
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-api.txt

      - name: Ejecutar tests de integración de la API
        run: |
          python -m pytest tests/api/ \
            -v \
            --tb=short \
            -q
        env:
          ADMIN_PASSWORD: "testadmin123"
          ADMIN_USER: "admin"
          # Sin DATABASE_URL → SQLiteRepository en archivo temporal

  # ── Job 7: Build frontend React/TypeScript ───────────────────────────
  build-frontend:
    name: "Build Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configurar pnpm desde packageManager
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Instalar dependencias desde lockfile
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build TypeScript + Vite
        run: pnpm run build
        working-directory: frontend
        env:
          VITE_API_URL: "https://levelup-elo.onrender.com"

  # ── Job 9: Trazabilidad spec → tests (roadmap A-2) ───────────────────
  # scripts/check_traceability.py: every FR and acceptance scenario of specs/*/spec.md has a row
  # whose tests are collected, pass and are not skipped (PostgreSQL branch included, so the
  # service and both requirement files are needed). PENDING is rejected on a pull request that
  # changes a spec's code (its Code Scope or a test it cites), whatever the branch, so the files
  # the pull request changes are passed in.
  traceability:
    name: "Trazabilidad spec → tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levelup_audit
          POSTGRES_PASSWORD: audit_local_only
          POSTGRES_DB: levelup_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelup_audit -d levelup_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request HEAD is the merge commit; HEAD^1 is the base it is compared with.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias (V1 y API)
        run: pip install -r requirements.txt -r requirements-api.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configurar pnpm desde packageManager
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Instalar dependencias del frontend desde lockfile
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Chromium for the pinned Playwright version
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Files the pull request changes
        if: github.event_name == 'pull_request'
        # --no-renames lists a moved file under its old and its new path, so moving code out of a
        # spec's Code Scope still counts as changing it.
        run: git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"

      - name: Verificar trazabilidad (referencias recogidas, en verde y sin omitir)
        run: |
          args=(--run)
          if [ -f "$RUNNER_TEMP/changed-files.txt" ]; then
            args+=(--changed-files "$RUNNER_TEMP/changed-files.txt")
          fi
          python scripts/check_traceability.py "${args[@]}"
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://levelup_audit:audit_local_only@localhost:5432/levelup_audit
          DATABASE_SSLMODE: disable
          ADMIN_PASSWORD: testadmin123
          TESTING: "1"
