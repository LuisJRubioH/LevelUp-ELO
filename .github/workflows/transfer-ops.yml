# transfer-ops — one-off operations for the redesign transfer (docs/transfer.md § 4–6).
# Lives only on ops/* branches; never merged to main. Each job runs when its branch is pushed:
#
#   ops/transfer-backup    1. backup-and-rehearse: read-only dump of production (full + public
#                             schema) and of the private bucket `procedimientos`; the migration
#                             rehearsed twice on a THROWAWAY PostgreSQL 17 (never on production);
#                             everything encrypted with BACKUP_PASSPHRASE before upload.
#                          2. verify-backup-artifact: downloads that artifact, checks its SHA-256,
#                             decrypts it, verifies every file and restores the dump into a second
#                             throwaway database with the same row counts as production.
#   ops/transfer-precheck  before F-1 ships (spec 001 T084, docs/transfer.md § 6): read-only. Does
#                         the courses.block CHECK accept the four blocks, and how many Semillero
#                         students lack a valid grade (the list only in an encrypted artifact).
#   ops/transfer-dbcheck   read-only SQL checks on production after the switch (§ 5 queries), and
#                          whether the newest procedures reached Storage. Run it after verify.
#   ops/transfer-verify    scripts/verify_deployment.py against production with the test accounts,
#                          or with the optional VERIFY_STUDENT / VERIFY_DIAGNOSTIC_STUDENT /
#                          VERIFY_TEACHER secrets ("user:password"; user names masked in the log).
#
# The repository is public: anyone can read these logs and download the artifacts. Logs carry
# counts only, connection details are masked, raw command output (which can quote rows) stays in
# the encrypted backup, and the only artifacts holding data are encrypted. Production secrets live
# in the GitHub Environment `production-ops` and are given only to the steps that read production.
# Restrict that environment to the ops/transfer-* branches and require the owner's approval.

name: transfer-ops

on:
  push:
    branches: [ops/transfer-precheck, ops/transfer-backup, ops/transfer-dbcheck, ops/transfer-verify]

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command inside a pipeline (e.g. `script | tee`) fails the step.
    shell: bash

env:
  PGSSLMODE: require
  SCRATCH_URL: postgresql://scratch:scratch_local_only@localhost:5432/scratch

jobs:
  backup-and-rehearse:
    if: github.ref_name == 'ops/transfer-backup'
    runs-on: ubuntu-24.04
    environment: production-ops
    timeout-minutes: 45
    outputs:
      stamp: ${{ steps.encrypt.outputs.stamp }}
      artifact_sha256: ${{ steps.encrypt.outputs.sha256 }}
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_USER: scratch
          POSTGRES_PASSWORD: scratch_local_only
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scratch -d scratch"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Mask connection details and check the secrets
        id: check
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          for var in ("MIGRATION_DATABASE_URL", "SUPABASE_URL"):
              u = urllib.parse.urlsplit(os.environ.get(var, ""))
              parts = [u.password, u.hostname, u.netloc]
              if u.username and "." in u.username:          # postgres.<project-ref>
                  parts += [u.username] + u.username.split(".")[1:]
              parts += [t for t in (u.hostname or "").split(".") if len(t) >= 16]  # <ref>.supabase.co
              for p in filter(None, parts):
                  print(f"::add-mask::{p}")
          PY
          for v in MIGRATION_DATABASE_URL SUPABASE_URL SUPABASE_KEY BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing in environment production-ops"; exit 1; }
          done
          case "$MIGRATION_DATABASE_URL" in
            *:6543/*) echo "::error::MIGRATION_DATABASE_URL is the transaction pooler (6543); use the session pooler (5432)"; exit 1;;
          esac
          [ ${#BACKUP_PASSPHRASE} -ge 20 ] || { echo "::error::BACKUP_PASSPHRASE must have at least 20 characters"; exit 1; }
          echo "secrets present"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API requirements
        run: pip install -r requirements-api.txt

      - name: PostgreSQL 17 client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Production, read only — server version and rows per table
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          mkdir -p backup
          pg_dump --version
          # Every statement runs inside a READ ONLY transaction: a write would be rejected.
          psql "$MIGRATION_DATABASE_URL" -X -q -At -v ON_ERROR_STOP=1 > backup/source-counts.txt <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT format('SELECT %L || ''|'' || count(*) FROM public.%I', table_name, table_name)
            FROM information_schema.tables
           WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
           ORDER BY table_name \gexec
          COMMIT;
          SQL
          psql "$MIGRATION_DATABASE_URL" -X -q -At -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT 'server ' || current_setting('server_version');
          SELECT 'schema already migrated: ' || (to_regclass('public.student_course_topic_elo') IS NOT NULL);
          COMMIT;
          SQL
          echo "tables: $(wc -l < backup/source-counts.txt); rows per table:"
          cat backup/source-counts.txt

      - name: Production, read only — full dump (every schema the role can read)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          # pg_dump reads inside a single READ ONLY snapshot; it never writes to the source.
          pg_dump --format=custom --no-owner --no-privileges --file=backup/full.dump "$MIGRATION_DATABASE_URL" \
            || { rm -f backup/full.dump; echo "::warning::Full dump not possible (Supabase-managed schemas); public.dump is the application backup"; }

      - name: Production, read only — application dump (public schema)
        id: public_dump
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pg_dump --format=custom --no-owner --no-privileges --schema=public --file=backup/public.dump "$MIGRATION_DATABASE_URL"

      - name: Throwaway copy — Supabase roles
        # Policies or grants in a Supabase dump may name these roles; they must exist to restore.
        if: always() && steps.public_dump.outcome == 'success'
        env:
          PGSSLMODE: disable
        run: psql "$SCRATCH_URL" -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"

      - name: Throwaway copy — restore, migrate twice, verify (no production credentials here)
        if: always() && steps.public_dump.outcome == 'success'
        run: |
          # This step gets no production secret: the migrations can only reach the scratch database.
          [ -z "${MIGRATION_DATABASE_URL:-}${DATABASE_URL:-}" ] || { echo "::error::production URL in scope"; exit 1; }
          DUMP=backup/full.dump; [ -f "$DUMP" ] || DUMP=backup/public.dump
          # A failing command's raw output can quote production rows (PostgreSQL: "DETAIL: Key
          # (email)=(…) is duplicated"). It goes only into the encrypted backup; the log and the
          # public report get the script's own lines (checks, counts, result).
          rc=0
          python scripts/rehearse_migration.py --dump "$DUMP" --scratch-url "$SCRATCH_URL" \
            --scratch-sslmode disable --report backup/rehearsal-full.txt \
            > backup/rehearsal-output.txt 2>&1 || rc=$?
          python3 .github/scripts/public_rehearsal_summary.py backup/rehearsal-output.txt \
            > backup/rehearsal.txt
          cat backup/rehearsal.txt
          exit "$rc"

      - name: Production, read only — bucket procedimientos (every object, checked against storage.objects)
        if: always() && steps.check.outcome == 'success'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/backup_storage_bucket.py --out backup/procedimientos \
            --database-url "$MIGRATION_DATABASE_URL" --strict-catalog | tee backup/bucket.txt

      - name: Encrypt the backup and prove it decrypts
        id: encrypt
        if: always()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -f backup/public.dump ] || { echo "::error::no application dump was produced"; exit 1; }
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          (cd backup && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          echo "files in backup: $(wc -l < backup/SHA256SUMS)"
          TAR="levelup-backup-$STAMP.tar.gz"
          tar -C backup -czf "$TAR" .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric \
            --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o "$TAR.gpg" "$TAR" <<< "$BACKUP_PASSPHRASE"
          # Decrypt it back with the same passphrase before the plaintext is deleted.
          PLAIN=$(sha256sum "$TAR" | cut -d' ' -f1)
          ROUND=$(gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 --decrypt "$TAR.gpg" <<< "$BACKUP_PASSPHRASE" | sha256sum | cut -d' ' -f1)
          [ "$PLAIN" = "$ROUND" ] || { echo "::error::decryption self-test failed"; exit 1; }
          SHA=$(sha256sum "$TAR.gpg" | cut -d' ' -f1)
          echo "encrypted backup $TAR.gpg: $(stat -c%s "$TAR.gpg") bytes; artifact sha256 $SHA; decryption self-test OK"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p reports
          cp backup/rehearsal.txt backup/bucket.txt backup/source-counts.txt reports/ 2>/dev/null || true
          rm -rf backup "$TAR"

      - name: Upload the encrypted backup (the only artifact with data)
        if: always() && steps.encrypt.outputs.stamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: levelup-backup-${{ steps.encrypt.outputs.stamp }}-encrypted
          path: levelup-backup-*.tar.gz.gpg
          retention-days: 7
          if-no-files-found: error

      - name: Upload the reports (counts and check results only)
        if: always() && steps.encrypt.outputs.stamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: transfer-reports-${{ steps.encrypt.outputs.stamp }}
          path: reports/
          retention-days: 30

  verify-backup-artifact:
    needs: backup-and-rehearse
    if: always() && github.ref_name == 'ops/transfer-backup' && needs.backup-and-rehearse.outputs.stamp != ''
    runs-on: ubuntu-24.04
    environment: production-ops
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_USER: scratch
          POSTGRES_PASSWORD: scratch_local_only
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scratch -d scratch"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STAMP: ${{ needs.backup-and-rehearse.outputs.stamp }}
      EXPECTED_SHA256: ${{ needs.backup-and-rehearse.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the restore script's dependency
        run: pip install "httpx>=0.27,<1.0"

      - name: PostgreSQL 17 client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Download the encrypted artifact
        uses: actions/download-artifact@v4
        with:
          name: levelup-backup-${{ needs.backup-and-rehearse.outputs.stamp }}-encrypted
          path: downloaded

      - name: Check, decrypt and verify every file
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          F="downloaded/levelup-backup-$STAMP.tar.gz.gpg"
          GOT=$(sha256sum "$F" | cut -d' ' -f1)
          [ "$GOT" = "$EXPECTED_SHA256" ] || { echo "::error::downloaded artifact differs from the uploaded one"; exit 1; }
          echo "downloaded artifact sha256 matches the uploaded one"
          mkdir restored
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 --decrypt "$F" <<< "$BACKUP_PASSPHRASE" | tar -xz -C restored
          (cd restored && sha256sum --quiet -c SHA256SUMS)
          echo "every file matches SHA256SUMS ($(wc -l < restored/SHA256SUMS) files)"
          python scripts/restore_storage_bucket.py --backup restored/procedimientos
          echo "dump entries: $(pg_restore --list restored/public.dump | grep -vc '^;')"

      - name: Restore the dump into a second throwaway database and compare row counts
        env:
          PGSSLMODE: disable
        run: |
          psql "$SCRATCH_URL" -q -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          pg_restore --no-owner --no-privileges --schema=public --dbname="$SCRATCH_URL" restored/public.dump \
            2> restore.err || true
          # Count the errors, never print them: pg_restore quotes row data in its messages.
          ERRORS=$(grep -i "error:" restore.err | grep -vc 'schema "public" already exists' || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::pg_restore reported $ERRORS errors (not shown here: they can quote rows)"; exit 1
          fi
          psql "$SCRATCH_URL" -X -q -At -v ON_ERROR_STOP=1 > restored-counts.txt <<'SQL'
          SELECT format('SELECT %L || ''|'' || count(*) FROM public.%I', table_name, table_name)
            FROM information_schema.tables
           WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
           ORDER BY table_name \gexec
          SQL
          if ! diff restored/source-counts.txt restored-counts.txt; then
            echo "::error::row counts of the restored copy differ from production at backup time"; exit 1
          fi
          echo "VERIFY: PASS — restored copy has the same rows per table as production at backup time ($(wc -l < restored-counts.txt) tables)"

      - name: Remove the plaintext from the runner
        if: always()
        run: rm -rf restored downloaded restored-counts.txt restore.err

  precheck:
    # Spec 001 task T084, before F-1 is deployed (docs/transfer.md § 6). Read-only, like dbcheck.
    # The log carries counts and the courses.block verdict; the list of accounts (student data)
    # goes only into an artifact encrypted with BACKUP_PASSPHRASE.
    if: github.ref_name == 'ops/transfer-precheck'
    runs-on: ubuntu-24.04
    environment: production-ops
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Mask connection details and check the secrets
        id: check
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ.get("MIGRATION_DATABASE_URL", ""))
          parts = [u.password, u.hostname, u.netloc]
          if u.username and "." in u.username:
              parts += [u.username] + u.username.split(".")[1:]
          for p in filter(None, parts):
              print(f"::add-mask::{p}")
          PY
          for v in MIGRATION_DATABASE_URL BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing in environment production-ops"; exit 1; }
          done
          [ ${#BACKUP_PASSPHRASE} -ge 20 ] || { echo "::error::BACKUP_PASSPHRASE must have at least 20 characters"; exit 1; }
          echo "secrets present"

      - name: courses.block CHECK accepts the four blocks (survey § 4.3 step 1)
        if: steps.check.outcome == 'success'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          psql "$MIGRATION_DATABASE_URL" -X -q -At -v ON_ERROR_STOP=1 > block-check.txt <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT pg_get_constraintdef(oid) FROM pg_constraint
           WHERE conrelid = to_regclass('public.courses') AND contype = 'c';
          COMMIT;
          SQL
          # Schema only, no data: the constraint definitions themselves.
          echo "CHECK constraints on courses: $(grep -c . block-check.txt || true)"
          cat block-check.txt
          # The same parser and rule the migration applies (src/infrastructure/persistence/course_blocks.py).
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src.infrastructure.persistence.course_blocks import (
              CourseBlockConstraintError, allowed_blocks, require_course_blocks)
          sql = " ".join(line for line in open("block-check.txt").read().splitlines() if line)
          try:
              require_course_blocks(sql)
          except CourseBlockConstraintError as exc:
              print(f"::error::BLOCK CHECK: FAIL — the migration would stop on it: {exc}")
              sys.exit(1)
          allowed = allowed_blocks(sql)
          print("BLOCK CHECK: PASS — " + ("no CHECK on courses.block" if allowed is None
                else f"accepts the four blocks; allowed values: {sorted(allowed)}"))
          PY

      - name: Semillero students without a valid grade (survey § 3 step 1)
        if: always() && steps.check.outcome == 'success'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          # Counts only in the log; a grade outside 6–11 is reported as invalid, never printed.
          psql "$MIGRATION_DATABASE_URL" -X -q -At -F ': ' -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT CASE WHEN grade IS NULL OR grade = '' THEN 'semillero students without a grade'
                      WHEN grade IN ('6', '7', '8', '9', '10', '11') THEN 'semillero students in grade ' || grade
                      ELSE 'semillero students with an invalid grade' END,
                 count(*) || ' (' || count(*) FILTER (WHERE is_test_user = 1) || ' test users)'
            FROM users WHERE role = 'student' AND education_level = 'semillero'
           GROUP BY 1 ORDER BY 1;
          COMMIT;
          SQL
          mkdir -p precheck
          psql "$MIGRATION_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 > precheck/semillero-without-valid-grade.csv <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          COPY (
            SELECT u.id, u.username, u.grade, u.is_test_user, u.created_at,
                   string_agg(e.course_id, ', ' ORDER BY e.course_id) AS enrolled_courses
              FROM users u
              LEFT JOIN enrollments e ON e.user_id = u.id
             WHERE u.role = 'student' AND u.education_level = 'semillero'
               AND (u.grade IS NULL OR u.grade NOT IN ('6', '7', '8', '9', '10', '11'))
             GROUP BY u.id, u.username, u.grade, u.is_test_user, u.created_at
             ORDER BY u.id
          ) TO STDOUT WITH CSV HEADER;
          COMMIT;
          SQL
          ROWS=$(( $(wc -l < precheck/semillero-without-valid-grade.csv) - 1 ))
          echo "ACCOUNTS: $ROWS semillero students without a valid grade (listed only in the encrypted artifact)"
          echo "ROWS=$ROWS" >> "$GITHUB_ENV"

      - name: Encrypt the account list (the only artifact with data)
        id: encrypt
        if: always() && env.ROWS != ''
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          OUT="t084-precheck-$STAMP.csv.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric \
            --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o "$OUT" precheck/semillero-without-valid-grade.csv <<< "$BACKUP_PASSPHRASE"
          PLAIN=$(sha256sum precheck/semillero-without-valid-grade.csv | cut -d' ' -f1)
          ROUND=$(gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 --decrypt "$OUT" <<< "$BACKUP_PASSPHRASE" | sha256sum | cut -d' ' -f1)
          [ "$PLAIN" = "$ROUND" ] || { echo "::error::decryption self-test failed"; exit 1; }
          echo "encrypted list $OUT; decryption self-test OK"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted list
        if: always() && steps.encrypt.outputs.stamp != ''
        uses: actions/upload-artifact@v4
        with:
          name: t084-precheck-${{ steps.encrypt.outputs.stamp }}-encrypted
          path: t084-precheck-*.csv.gpg
          retention-days: 7
          if-no-files-found: error

      - name: Remove the plaintext from the runner
        if: always()
        run: rm -rf precheck block-check.txt

  dbcheck:
    if: github.ref_name == 'ops/transfer-dbcheck'
    runs-on: ubuntu-24.04
    environment: production-ops
    timeout-minutes: 10
    steps:
      - name: Mask connection details
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ.get("MIGRATION_DATABASE_URL", ""))
          parts = [u.password, u.hostname, u.netloc]
          if u.username and "." in u.username:
              parts += [u.username] + u.username.split(".")[1:]
          for p in filter(None, parts):
              print(f"::add-mask::{p}")
          PY
      - name: Read-only checks (docs/transfer.md § 5)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT origin, approximate, COUNT(*) FROM student_course_topic_elo GROUP BY 1, 2 ORDER BY 1, 2;
          SELECT COUNT(*) AS reconciled_without_provenance FROM student_course_topic_elo
           WHERE origin LIKE 'legacy\_%' AND (approximate IS NOT TRUE OR legacy_source_key IS NULL OR reconciled_at IS NULL);
          SELECT COUNT(*) AS student_topic_elo FROM student_topic_elo;
          SELECT COUNT(*) AS exam_sessions_unknown_status FROM exam_sessions WHERE global_elo_status IS NULL;
          SELECT COUNT(*) AS users, COUNT(*) FILTER (WHERE role = 'admin') AS admins FROM users;
          -- After ops/transfer-verify: its procedure (the newest row) must show in_storage = t.
          -- f means the upload fell back to the row's copy (R9): check SUPABASE_URL/KEY on Render.
          SELECT id AS latest_submission, submitted_at::date AS day,
                 storage_url IS NOT NULL AS in_storage, image_data IS NOT NULL AS in_row
            FROM procedure_submissions ORDER BY id DESC LIMIT 5;
          COMMIT;
          SQL

  verify:
    if: github.ref_name == 'ops/transfer-verify'
    runs-on: ubuntu-24.04
    environment: production-ops
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-api.txt
      - name: Deployed commit
        run: git log -1 --format='%H %s'
      - name: verify_deployment.py
        env:
          # Optional "user:password" secrets; each one left unset keeps the script's default account.
          SECRET_VERIFY_STUDENT: ${{ secrets.VERIFY_STUDENT }}
          SECRET_VERIFY_DIAGNOSTIC_STUDENT: ${{ secrets.VERIFY_DIAGNOSTIC_STUDENT }}
          SECRET_VERIFY_TEACHER: ${{ secrets.VERIFY_TEACHER }}
        run: |
          for v in VERIFY_STUDENT VERIFY_DIAGNOSTIC_STUDENT VERIFY_TEACHER; do
            s="SECRET_$v"
            if [ -n "${!s}" ]; then
              echo "::add-mask::${!s%%:*}"
              export "$v=${!s}"
            fi
          done
          python scripts/verify_deployment.py --api-url https://levelup-elo.onrender.com \
            --frontend-url https://luislevelupelo.vercel.app --wait 300 --report verify.txt
      - name: Remove the verification accounts' user names from the report
        # The log masks them; the artifact is a file, which masking does not touch.
        if: always()
        env:
          SECRET_VERIFY_STUDENT: ${{ secrets.VERIFY_STUDENT }}
          SECRET_VERIFY_DIAGNOSTIC_STUDENT: ${{ secrets.VERIFY_DIAGNOSTIC_STUDENT }}
          SECRET_VERIFY_TEACHER: ${{ secrets.VERIFY_TEACHER }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          report = pathlib.Path("verify.txt")
          if report.exists():
              text = report.read_text(encoding="utf-8")
              for var in ("SECRET_VERIFY_STUDENT", "SECRET_VERIFY_DIAGNOSTIC_STUDENT",
                          "SECRET_VERIFY_TEACHER"):
                  user = os.environ.get(var, "").partition(":")[0]
                  if user:
                      text = text.replace(user, "<" + var.removeprefix("SECRET_") + ">")
              report.write_text(text, encoding="utf-8")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify.txt
          retention-days: 90
