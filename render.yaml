## render.yaml — Backend del sandbox de UX testing (repo Oulad_redesing)
## No es el servicio de producción: ese vive en el repo LuisJRubioH/LevelUp-ELO.
## Documentación: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: oulad-sandbox-api
    plan: free
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements-api.txt
    ## Las migraciones NO corren dentro del proceso HTTP. `_migrate_db()` toma un
    ## advisory lock de SESIÓN y sobre el pooler de transacciones (6543) la sesión
    ## no sobrevive al commit, así que el lock deja de proteger. scripts/migrate.py
    ## es un proceso aparte, corto, que usa MIGRATION_DATABASE_URL (conexión
    ## directa) y termina antes de que uvicorn acepte tráfico. Si falla, el
    ## servicio no arranca — es lo correcto: mejor caído que con esquema viejo.
    ##
    ## preDeployCommand sería el sitio natural, pero Render no lo ofrece en
    ## instancias free. Al pasar a un plan de pago, mover esta primera mitad allí:
    ##   preDeployCommand: python scripts/migrate.py
    startCommand: python scripts/migrate.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production

      # El proceso web no migra: lo hace la primera mitad del startCommand.
      - key: RUN_MIGRATIONS
        value: "0"

      # UN SOLO proceso, y una sola instancia. El lobby de PvP y las salas de
      # notificaciones viven en memoria: con dos procesos los jugadores no se
      # emparejan entre ellos y los eventos solo llegan a la mitad, sin error
      # visible. El arranque falla si esto sube de 1 (api/config.py). Escalar
      # exige antes la coordinación compartida que describe AGENTS.md R18.
      - key: WEB_CONCURRENCY
        value: "1"

      # ── Base de datos (Supabase) ──────────────────────────────────────────
      # Tráfico normal: connection pooler, puerto 6543 — no el directo 5432.
      - key: DATABASE_URL
        sync: false  # Valor secreto — pegar en el dashboard de Render

      # Solo para preDeployCommand: conexión DIRECTA (puerto 5432) o pooler de
      # sesión, donde el advisory lock de _migrate_db() sí protege.
      - key: MIGRATION_DATABASE_URL
        sync: false

      # ── Supabase Storage (bucket privado `procedimientos`) ───────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # ── JWT ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        generateValue: true  # Render genera uno seguro automáticamente

      # Redis/Valkey compartido para límites consistentes entre instancias.
      - key: RATE_LIMIT_STORAGE_URI
        sync: false

      # ── Admin seed ───────────────────────────────────────────────────────
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false  # Valor secreto

      # ── IA (KatIA socrática + revisión de procedimientos) ────────────────
      # Sin esta key la IA degrada con gracia; el resto de la app funciona.
      - key: SYSTEM_AI_API_KEY
        sync: false

      # ── CORS ─────────────────────────────────────────────────────────────
      # Formato JSON. Pegar el dominio exacto que Vercel asigne al sandbox:
      #   '["https://<proyecto>.vercel.app","http://localhost:5173"]'
      - key: CORS_ORIGINS
        sync: false
